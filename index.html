<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ต้นแบบระบบสารสนเทศงานวิจัยและนวัตกรรมอาชีวศึกษา — เว็บจำลองเพื่อการศึกษา">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ต้นแบบระบบสารสนเทศงานวิจัยและนวัตกรรมอาชีวศึกษา</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --surface-3:#E7EDF2;
  --ink:#14202B; --ink-2:#47586A; --ink-3:#7A8A99;
  --line:#D6DEE5; --line-2:#B7C4CF;
  --brand:#0A1D45; --brand-2:#254C9D; --brand-soft:#E6ECF9; --on-brand:#FFFFFF;
  --gold:#953115; --gold-soft:#F9EAE6;
  --ok:#14724A; --ok-soft:#E6F9F1;
  --warn:#9A5B08; --warn-soft:#F9F1E6;
  --bad:#A4133C; --bad-soft:#F9E6EC;
  --info:#175F8C; --info-soft:#E6F2F9;
  --mute:#5C6B78; --mute-soft:#E7EBEF;
  --shadow:0 1px 2px rgba(20,32,43,.07), 0 8px 24px rgba(20,32,43,.07);
  /* สีชุดหมวดหมู่สำหรับแผนภูมิ ผ่านการตรวจค่าความต่างสำหรับผู้มีภาวะตาบอดสีแล้ว */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --grid:#E4E9ED; --axis:#8A98A4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1620; --surface:#16202B; --surface-2:#1C2733; --surface-3:#22303D;
  --ink:#E6EDF3; --ink-2:#A8B8C6; --ink-3:#7C8D9C;
  --line:#2C3A48; --line-2:#44566A;
  --brand:#85A2E0; --brand-2:#ACC1EC; --brand-soft:#171D2C; --on-brand:#060B16;
  --gold:#E09985; --gold-soft:#2C1B17;
  --ok:#85E0B9; --ok-soft:#172C23;
  --warn:#E0B985; --warn-soft:#2C2317;
  --bad:#E0859F; --bad-soft:#2C171D;
  --info:#85BDE0; --info-soft:#17242C;
  --mute:#9BAAB7; --mute-soft:#222E3A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --grid:#27333F; --axis:#7C8D9C;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1620; --surface:#16202B; --surface-2:#1C2733; --surface-3:#22303D;
  --ink:#E6EDF3; --ink-2:#A8B8C6; --ink-3:#7C8D9C;
  --line:#2C3A48; --line-2:#44566A;
  --brand:#85A2E0; --brand-2:#ACC1EC; --brand-soft:#171D2C; --on-brand:#060B16;
  --gold:#E09985; --gold-soft:#2C1B17;
  --ok:#85E0B9; --ok-soft:#172C23;
  --warn:#E0B985; --warn-soft:#2C2317;
  --bad:#E0859F; --bad-soft:#2C171D;
  --info:#85BDE0; --info-soft:#17242C;
  --mute:#9BAAB7; --mute-soft:#222E3A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --grid:#27333F; --axis:#7C8D9C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Sarabun",system-ui,sans-serif;font-size:15px;line-height:1.7}
h1,h2,h3,h4,h5{font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;margin:0;line-height:1.35;font-weight:600;text-wrap:balance}
.sysname .w{white-space:nowrap}
.top .nm span.w{display:inline;font-size:inherit;font-weight:inherit;opacity:1}
p{margin:0}
button{font-family:inherit}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---- prototype banner ---- */
#banner{position:relative;z-index:60;background:var(--gold-soft);
  border-bottom:1px solid var(--gold);color:var(--gold);font-size:12.5px;
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:6px 16px}
#banner b{font-weight:600}
#banner button{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:5px;
  font-size:11.5px;padding:1px 9px;cursor:pointer}
#banner button:hover{background:var(--gold);color:var(--surface)}

/* ---- app shell ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--brand);color:var(--on-brand);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:9px 18px}
.top .lg{display:flex;gap:9px;align-items:center;cursor:pointer}
.top .sq{width:30px;height:30px;flex:0 0 auto;border-radius:50%;background:#FFFFFF;
  object-fit:contain;padding:1px;box-sizing:border-box;display:block;
  box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.top .nm{font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:14px;font-weight:600;line-height:1.2}
.top .nm span{display:block;font-size:10.5px;font-weight:400;opacity:.8}
.top .sp{flex:1}
.roleswap{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.roleswap .lb{font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:12px;
  font-weight:600;color:var(--on-brand);opacity:.92;margin-right:2px;white-space:nowrap}
@media(max-width:700px){.roleswap{width:100%}.roleswap .lb{width:100%;margin:0 0 2px}}
.roleswap button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--on-brand);
  border-radius:20px;font-size:12px;padding:3px 12px;cursor:pointer}
.roleswap button[aria-pressed="true"]{background:var(--on-brand);color:var(--brand);border-color:var(--on-brand);font-weight:600}
.roleswap .rinfo{background:var(--gold);border:1px solid var(--gold);color:var(--gold-soft);
  border-radius:20px;font-size:12px;font-weight:600;padding:3px 13px;cursor:pointer;margin-left:10px}
.roleswap .rinfo:hover{filter:brightness(1.12)}
.roleswap .rinfo[aria-current="page"]{box-shadow:0 0 0 2px var(--gold-soft)}
.roleswap .rinfo:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
@media(max-width:700px){.roleswap .rinfo{margin-left:0}}
.roleswap button:focus-visible,.top .lg:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.body{display:grid;grid-template-columns:212px 1fr;min-height:60vh;max-width:1280px;margin:0 auto;width:100%}
@media(max-width:820px){.body{grid-template-columns:1fr}}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
@media(max-width:820px){.side{flex-direction:row;overflow-x:auto;min-width:0;border-right:0;border-bottom:1px solid var(--line);padding:9px 12px}}
.side .sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:12px 9px 4px}
@media(max-width:820px){.side .sec{display:none}}
.nv{display:flex;justify-content:space-between;gap:8px;align-items:center;background:none;border:0;
  font-size:13px;color:var(--ink-2);padding:7px 10px;border-radius:6px;cursor:pointer;text-align:left;
  white-space:normal;line-height:1.4}
.nv > span:first-child{min-width:0;overflow-wrap:anywhere}
.nv .cnt{flex:0 0 auto}
.nv:hover{background:var(--surface-2)}
.nv[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nv:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}
.nv .cnt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;line-height:1.6}

.main{padding:20px 22px 48px;min-width:0;background:var(--bg)}
@media(max-width:560px){.main{padding:16px}}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.crumbs button{background:none;border:0;color:var(--brand-2);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.pagehead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.pagehead h2{font-size:21px}
.pagehead .ph-sub{width:100%;font-size:13.5px;color:var(--ink-2);margin-top:3px}

/* ---- atoms ---- */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:13px;
  font-weight:500;border-radius:7px;padding:7px 15px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink-2);cursor:pointer}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2);color:var(--on-brand)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
.btn.sm{font-size:12px;padding:4px 11px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:20px;
  padding:1px 10px;white-space:nowrap;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-draft{background:var(--mute-soft);color:var(--mute)}
.st-wait{background:var(--warn-soft);color:var(--warn)}
.st-fix{background:var(--bad-soft);color:var(--bad)}
.st-approved{background:var(--info-soft);color:var(--info)}
.st-published{background:var(--ok-soft);color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:14px}
.card > h3{font-size:15.5px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 14px}
.tile .k{font-size:11.5px;color:var(--ink-3)}
.tile .v{font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:23px;font-weight:600;line-height:1.25}
.tile.w .v{color:var(--warn)} .tile.b .v{color:var(--bad)} .tile.g .v{color:var(--ok)} .tile.i .v{color:var(--info)}

.alert{border-radius:8px;padding:10px 13px;font-size:13.5px;margin-bottom:13px;border:1px solid}
.alert.i{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.alert.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.alert.b{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.alert.g{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.alert b{font-weight:600}
.alert ul{margin:6px 0 0;padding-left:20px}
.alert button.lnk{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:13px}
.field label{font-size:12.5px;color:var(--ink-2);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-weight:500}
.field label .req{color:var(--bad)}
.field input,.field select,.field textarea{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:7px;padding:8px 11px;width:100%}
.field textarea{min-height:104px;resize:vertical;line-height:1.65}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-2);outline-offset:0;border-color:var(--brand-2)}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad);background:var(--bad-soft)}
.field .err{font-size:12px;color:var(--bad);font-weight:500}
.field .cnt{font-size:11.5px;color:var(--ink-3);text-align:right}
.field .cnt.bad{color:var(--bad);font-weight:600}
.ro{background:var(--surface-2);color:var(--ink-2)}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;border:1px solid var(--line-2);border-radius:20px;padding:3px 11px;color:var(--ink-2);
  background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:500}
.chip.tag{cursor:default;background:var(--brand-soft);border-color:var(--brand-2);color:var(--brand)}
.chip.tag button{background:none;border:0;color:inherit;cursor:pointer;font-size:13px;padding:0 0 0 3px;line-height:1}
.chip:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{background:var(--surface-2);text-align:left;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-weight:600;
  font-size:11.5px;color:var(--ink-2);padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td b{color:var(--ink);font-weight:600}

.rec{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:var(--surface);margin-bottom:10px}
.rec h4{font-size:15px}
.rec .met{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 14px}
.rec .ab{font-size:13px;color:var(--ink-2);margin-top:7px}
.rec .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

.steps{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px;background:var(--surface)}
.steps div{flex:1;min-width:120px;padding:8px 12px;font-size:12px;color:var(--ink-3);border-right:1px solid var(--line)}
.steps div:last-child{border-right:0}
.steps div.on{background:var(--brand);color:var(--on-brand);font-weight:600}
.steps div.done{background:var(--brand-soft);color:var(--brand)}
.steps b{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;opacity:.75;font-weight:500}

.tl{border-left:2px solid var(--line);padding-left:16px;margin-left:6px}
.tl .it{position:relative;padding-bottom:15px}
.tl .it::before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;
  background:var(--line-2);border:2px solid var(--bg)}
.tl .it.done::before{background:var(--ok)}
.tl .it.now::before{background:var(--warn)}
.tl .t{font-size:14px;font-weight:600;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;color:var(--ink)}
.tl .d{font-size:12px;color:var(--ink-3)}
.tl .m{font-size:13px;color:var(--ink-2);margin-top:5px;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:9px 12px}

.ck{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);padding:5px 0;cursor:pointer}
.ck input{margin-top:5px;width:16px;height:16px;accent-color:var(--ok);flex:0 0 auto}
.ck.no{color:var(--bad)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;background:var(--surface-2);margin-bottom:8px}
.sw .tt{font-size:13.5px;color:var(--ink)}
.sw .ts{font-size:11.5px;color:var(--ink-3)}
.sw input{width:18px;height:18px;accent-color:var(--ok);flex:0 0 auto}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:152px 1fr 44px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
@media(max-width:520px){.bar{grid-template-columns:104px 1fr 40px}}
.bar .tr{height:17px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--brand-2);border-radius:4px}
.bar .n{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink)}
.bar .bl{min-width:0;overflow-wrap:anywhere;text-align:left;line-height:1.3}
.bar-a{width:100%;background:none;border:0;padding:2px 0;cursor:pointer;font-family:inherit;color:var(--ink-2);border-radius:5px}
.bar-a:hover .tr{outline:2px solid var(--brand-2);outline-offset:1px}
.bar-a:hover .bl{color:var(--brand-2);font-weight:500}
.bar-a:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
/* --- แผนภูมิวงแหวน --- */
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:172px;height:172px;flex:0 0 auto}
.dn-total{fill:var(--ink);font-size:30px;font-weight:700;text-anchor:middle;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif}
.dn-lab{fill:var(--ink-3);font-size:13px;text-anchor:middle;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif}
.lg-list{flex:1;min-width:190px;display:flex;flex-direction:column;gap:3px}
.lg-row{display:grid;grid-template-columns:13px 1fr auto auto;gap:9px;align-items:start;font-size:13px;
  color:var(--ink-2);padding:4px 0;border-bottom:1px solid var(--line);line-height:1.35}
.lg-row:last-child{border-bottom:0}
.lg-row .dsw{width:13px;height:13px;border-radius:3px;padding:0;border:0;background-clip:padding-box;margin-top:3px}
.lg-row .lg-n{min-width:0;overflow-wrap:anywhere}
.lg-row .lg-v{color:var(--ink);font-weight:600;min-width:34px;text-align:right}
.lg-row .lg-p{color:var(--ink-3);min-width:38px;text-align:right}
/* --- แผนภูมิเส้น --- */
.svg-wrap{overflow-x:auto;max-width:100%}
.grid2>*,.tiles>*,.rolecards>*,.limits>*{min-width:0}
.card{min-width:0}
.trend{width:100%;min-width:430px;height:auto;display:block}
.trend .gl{stroke:var(--grid);stroke-width:1}
.trend .ar{fill:var(--c1);opacity:.13}
.trend .ln{fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trend .dot{fill:var(--c1);stroke:var(--surface);stroke-width:2}
.trend .dot-em{fill:var(--c1);stroke:var(--surface);stroke-width:2.5}
.trend .dl{fill:var(--ink);font-size:12px;font-weight:600;text-anchor:middle;font-family:"IBM Plex Mono",monospace}
.trend .ax{fill:var(--axis);font-size:11px;text-anchor:middle;font-family:"IBM Plex Mono",monospace}
.trend .ax-r{text-anchor:end}
.chart-note{font-size:11.5px;color:var(--ink-3);margin-top:9px}
/* --- แถบสัดส่วนเต็ม 100 --- */
.stack{display:flex;height:26px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface-3);margin-bottom:10px}
.stack i{display:block;height:100%}
.funnel{display:flex;flex-direction:column;gap:7px}
.fn{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
@media(max-width:520px){.fn{grid-template-columns:96px 1fr 36px}}
.fn .tr{height:17px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.fn .fl{height:100%;border-radius:4px}
.fn .n{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink)}
.faq{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px;overflow:hidden}
.faq summary{cursor:pointer;padding:10px 14px;font-size:14px;font-weight:600;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;color:var(--ink);list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"+ ";color:var(--brand-2);font-weight:700}
.faq[open] summary::before{content:"− "}
.faq summary:focus-visible{outline:2px solid var(--brand-2);outline-offset:-2px}
.faq .a{padding:0 14px 12px;font-size:13.5px;color:var(--ink-2)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:16px}
@media(max-width:560px){.hero{padding:16px}}
.hero h2{font-size:clamp(20px,3.6vw,27px);letter-spacing:-.01em}
.hero p.sub{font-size:14px;color:var(--ink-2);margin-top:7px;max-width:56ch}

.lock{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:9px;padding:13px 15px;
  display:flex;flex-wrap:wrap;gap:11px;align-items:center;justify-content:space-between;margin-bottom:14px}
.lock p{font-size:13px;color:var(--gold)}
.lock-alt{flex:0 0 100%;min-width:0;font-size:12.5px;color:var(--gold);opacity:.85;
  border-top:1px dashed var(--gold);padding-top:9px;margin-top:2px}
.lock-alt{flex:0 0 100%;min-width:0;font-size:12.5px;color:var(--gold);opacity:.85;
  border-top:1px dashed var(--gold);padding-top:9px;margin-top:2px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:4px 14px;font-size:13.5px}
@media(max-width:620px){.kv{grid-template-columns:1fr}}
.kv dt{color:var(--ink-3);font-size:12.5px}
.kv dd{margin:0;color:var(--ink)}

/* role cards on home */
.rolecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.rolecard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.rolecard:hover{border-color:var(--brand-2);box-shadow:var(--shadow)}
.rolecard:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.rolecard .n{font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:15px;font-weight:600;color:var(--ink)}
.rolecard .d{font-size:12.5px;color:var(--ink-2)}
.rolecard .rmenu{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:2px}
.rolecard .rmenu b{display:inline;color:var(--ink-2);font-weight:600}
.rolecard .go{font-size:12px;color:var(--brand-2);font-weight:600;margin-top:auto;padding-top:6px}
.rolecard.on{border-color:var(--brand-2);background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand-2)}
.rolecard.on .go{color:var(--ink-3);font-weight:500}
.rolecard .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rolecard .now{font-size:10.5px;font-weight:600;letter-spacing:.3px;color:var(--on-brand);
  background:var(--brand-2);border-radius:999px;padding:2px 8px}

/* ข้อความที่พบในเนื้อหาเอกสาร และยอดเปิดดู */
.ftsnip{font-size:12.5px;color:var(--ink-2);line-height:1.6;background:var(--surface-2);
  border-left:3px solid var(--brand-2);border-radius:0 7px 7px 0;padding:8px 11px;margin:6px 0 0;overflow-wrap:anywhere}
.ftsnip b{color:var(--brand-2);font-weight:600}
.ftsnip mark{background:var(--warn-soft);color:var(--warn);font-weight:600;border-radius:3px;padding:0 2px}
.vw{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.toplist{display:flex;flex-direction:column}
.toprow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;font:inherit;color:inherit}
.toprow:last-child{border-bottom:0}
.toprow:hover .tt,.toprow:focus-visible .tt{color:var(--brand-2);text-decoration:underline}
.toprow:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
.toprow .rk{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--on-brand);
  background:var(--brand-2);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;margin-top:1px}
.toprow:first-child .rk{background:var(--gold);color:var(--gold-soft)}
.toprow > span:nth-child(2){min-width:0}
.toprow .tt{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
.toprow .ms{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
.toprow .vn{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:var(--brand-2);white-space:nowrap;margin-top:2px}

/* แผงสืบค้นขั้นสูงแบบพับได้ */
.advbox{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:14px 16px;margin-bottom:12px}
.advbox .advhd{font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.advbox .btnrow{margin-top:4px}

/* ช่องแนบเอกสารยืนยันสังกัด */
.updrop{border:1px dashed var(--line-2);border-radius:9px;padding:14px 16px;margin-top:10px;background:var(--surface)}
.updrop input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.updrop .pick{display:inline-block;cursor:pointer;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.updrop .pick:hover{border-color:var(--brand-2);color:var(--brand-2)}
.updrop input[type=file]:focus-visible + .pick{outline:2px solid var(--brand-2);outline-offset:2px}
.updrop .picked{display:flex;gap:9px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ok);
  background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:8px 11px;overflow-wrap:anywhere}

/* กล่องตรวจสอบสังกัดกับ ศธ.02 */
.vfy{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-top:14px;background:var(--surface-2)}
.vfy.ok{border-color:var(--ok);background:var(--ok-soft)}
.vfy.bad{border-color:var(--bad);background:var(--bad-soft)}
.vfy .ic{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:16px;font-weight:700;line-height:1}
.vfy.ok .ic{background:var(--ok);color:#fff}
.vfy.bad .ic{background:var(--bad);color:#fff}
.vfy .tx{min-width:0}
.vfy .tt{font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:14px;font-weight:600;color:var(--ink)}
.vfy.ok .tt{color:var(--ok)} .vfy.bad .tt{color:var(--bad)}
.vfy .ds{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.5;overflow-wrap:anywhere}
.spin{flex:0 0 auto;width:30px;height:30px;border-radius:50%;box-sizing:border-box;
  border:3px solid var(--line-2);border-top-color:var(--brand-2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* คำสำคัญและทิศทางการวิจัย */
.kwlist{display:flex;flex-direction:column}
.kwrow{display:grid;grid-template-columns:150px 1fr 44px 96px;gap:10px;align-items:center;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:7px 2px;cursor:pointer;font:inherit;color:inherit}
.kwrow:last-child{border-bottom:0}
.kwrow:hover .kw-n,.kwrow:focus-visible .kw-n{color:var(--brand-2);text-decoration:underline}
.kwrow:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
.kwrow .kw-n{font-size:13px;color:var(--ink);min-width:0;overflow-wrap:anywhere;line-height:1.3}
.kwrow .kw-c{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink);text-align:right}
.kwrow .tr{height:15px;background:var(--surface-3);border-radius:4px;overflow:hidden;min-width:40px}
.kwrow .fl{height:100%;background:var(--brand-2);border-radius:4px}
.kwrow:hover .tr,.kwrow:focus-visible .tr{outline:2px solid var(--brand-2);outline-offset:1px}
.kw-t{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 8px;text-align:center;white-space:nowrap}
.kw-t.up{background:var(--ok-soft);color:var(--ok)}
.kw-t.flat{background:var(--surface-3);color:var(--ink-2)}
.kw-t.down{background:var(--warn-soft);color:var(--warn)}
@media(max-width:600px){
  .kwrow{grid-template-columns:1fr 44px 96px;grid-template-areas:"n n n" "b c t";row-gap:5px;padding:9px 2px}
  .kwrow .kw-n{grid-area:n}.kwrow .tr{grid-area:b}.kwrow .kw-c{grid-area:c}.kwrow .kw-t{grid-area:t}}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:100;background:rgba(10,18,26,.5);display:grid;place-items:center;padding:20px}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:440px;width:100%;
  padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modal h3{font-size:17px;margin-bottom:8px}
#modal p{font-size:13.5px;color:var(--ink-2);margin-bottom:14px}
#toasts{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  z-index:110;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100% - 32px));pointer-events:none}
#toasts .toast{pointer-events:auto}
.toast{background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 14px;font-size:13.5px;
  display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.g{background:var(--ok);color:#fff}
.toast.b{background:var(--bad);color:#fff}
.toast button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:inherit;
  border-radius:6px;font-size:12px;padding:2px 10px;cursor:pointer;flex:0 0 auto}
.foot{max-width:1280px;margin:0 auto;padding:16px 22px 40px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function bulk(){
  var out = [], YEARS = ['2565','2566','2567','2568','2569'],
      PER = [28,33,38,43,33], n = 0, OCC = {};
  YEARS.forEach(function(y, yi){
    for(var i=0; i<PER[yi]; i++){
      var ti = TOPIC_SEQ.charCodeAt(n) - 65;
      var t = TOPICS[ti];
      OCC[ti] = (OCC[ti] || 0) + 1;
      var v = VARI[(OCC[ti] - 1) % VARI.length];
      var inst = INST_LIST[INST_SEQ.charCodeAt(n) - 65];
      var fnd = FUNDS[FUND_SEQ.charCodeAt(n) - 48];
      var ty = t[4];
      var used = (n % 3 === 0), ip = (n % 8 === 0);
      out.push({
        id:'VEC-'+y+'-'+CODE[ty]+'-'+String(1000+n),
        title: v + t[0], titleEn:'', type:ty, fund:fnd,
        year:y, yearDone:y, cat:t[1], major:t[2], inst:inst,
        lead:LEADS[n % LEADS.length], co:'', level:LEVELS[n % LEVELS.length],
        target:'ผู้เรียนและครูผู้สอน'+t[1], area:INST_AREA[inst],
        abstract:'การศึกษาครั้งนี้มีวัตถุประสงค์เพื่อ'+v.replace('การ','')+t[0]+' และหาประสิทธิภาพของผลงานเมื่อนำไปใช้จริงในบริบทของ'+inst+
          ' ดำเนินการโดยศึกษาสภาพปัญหา ออกแบบและสร้างผลงาน ตรวจสอบคุณภาพโดยผู้เชี่ยวชาญ แล้วนำไปทดลองใช้กับกลุ่มตัวอย่าง '+
          'ผลการศึกษาพบว่าผลงานมีประสิทธิภาพอยู่ในระดับมาก และผู้ใช้มีความพึงพอใจอยู่ในระดับมากที่สุด',
        kw:t[3], status:'published', owner:LEADS[n % LEADS.length],
        files:{full:true,abs:true,img:true},
        consent:{pub:true,req:true,contact:false,hold:false},
        util: used ? {orgs:[{n:INST_LIST[(n*7+2) % INST_LIST.length], u:'นำไปใช้ประกอบการเรียนการสอน', y:y}],
                      people:String(40 + (n%12)*25), ip: ip?'ได้รับอนุสิทธิบัตรแล้ว':'ยังไม่ยื่น',
                      ipno: ip?String(20000+n):'', awards:(n%9===0)?1:0} : null,
        hist:[{d:'ปีงบประมาณ '+y, t:'เผยแพร่บนระบบ'}]
      });
      n++;
    }
  });
  return out;
}

function countBy(list, keyFn){
  var m = {}; list.forEach(function(x){ var k = keyFn(x); if(!k) return; m[k] = (m[k]||0)+1; });
  return Object.keys(m).map(function(k){ return {k:k, v:m[k]}; }).sort(function(a,b){ return b.v-a.v; });
}
/* แผนภูมิแท่งแนวนอน ชุดข้อมูลเดียว ใช้สีเดียวเพราะสื่อ “ปริมาณ” ไม่ใช่ “ตัวตน” */
function barBlock(title, rows, unit, act){

  return '<div class="card"><h3>'+h(title)+'</h3><div class="bars">'+
    rows.map(function(r){
      var pct = Math.max(2, Math.round(r.v/max*100));

      var inner = '<span class="bl" title="'+lbl+'">'+h(r.k)+'</span>'+
        '<div class="tr" title="'+lbl+'"><div class="fl" style="width:'+pct+'%"></div></div>'+
        '<span class="n">'+r.v+'</span>';
      return act ? '<button class="bar bar-a" type="button" data-act="'+act+'" data-a="'+h(r.k)+'">'+inner+'</button>'
                 : '<div class="bar">'+inner+'</div>';

/* คำสำคัญที่พบบ่อยและทิศทาง เทียบสัดส่วนการปรากฏของคำสำคัญระหว่างช่วงปีต้นกับช่วงปีหลัง
   หารด้วยจำนวนผลงานของแต่ละช่วงก่อนเปรียบเทียบ เพราะแต่ละช่วงมีจำนวนผลงานไม่เท่ากัน */
var KW_EARLY = ['2565','2566','2567'], KW_LATE = ['2568','2569'];
function kwTrend(title, top){
  var pub = by('published');
  var ea = pub.filter(function(r){ return KW_EARLY.indexOf(r.year)>=0; });
  var la = pub.filter(function(r){ return KW_LATE.indexOf(r.year)>=0; });
  function tally(a){ var m={}; a.forEach(function(r){ (r.kw||[]).forEach(function(k){ m[k]=(m[k]||0)+1; }); }); return m; }
  var A = tally(pub), E = tally(ea), L = tally(la);
  var rows = Object.keys(A).map(function(k){
    var e = ea.length ? (E[k]||0)/ea.length : 0, l = la.length ? (L[k]||0)/la.length : 0;
    var dir = 'flat';
    if(e === 0) dir = l > 0 ? 'up' : 'flat';
    else if(l/e >= 1.25) dir = 'up';
    else if(l/e <= 0.80) dir = 'down';
    return {k:k, v:A[k], e:E[k]||0, l:L[k]||0, dir:dir};
  }).sort(function(a,b){ return b.v - a.v; }).slice(0, top || 10);
  if(!rows.length) return '<div class="card"><h3>'+h(title)+'</h3><p style="font-size:13px;color:var(--ink-3)">ยังไม่มีข้อมูล</p></div>';
  var max = Math.max.apply(null, rows.map(function(r){ return r.v; }));
  var LB = {up:'▲ มาแรง', flat:'● คงที่', down:'▼ ลดลง'};
  var up = rows.filter(function(r){ return r.dir==='up'; }).map(function(r){ return r.k; });
  return '<div class="card"><h3>'+h(title)+'</h3>'+
    '<p style="font-size:12.5px;color:var(--ink-2);margin-bottom:10px">'+
      'นับจากคำสำคัญในบัญชีคำศัพท์ควบคุมที่ลงไว้กับผลงานที่เผยแพร่แล้ว '+
      'ทิศทางคำนวณจากสัดส่วนการปรากฏในปีงบประมาณ '+KW_LATE[0]+'–'+KW_LATE[KW_LATE.length-1]+
      ' เทียบกับปี '+KW_EARLY[0]+'–'+KW_EARLY[KW_EARLY.length-1]+
      ' โดยหารด้วยจำนวนผลงานของแต่ละช่วงก่อน เพื่อไม่ให้ปีที่มีผลงานมากได้เปรียบ</p>'+
    '<div class="kwlist">'+
    rows.map(function(r){
      var pct = Math.max(2, Math.round(r.v/max*100));
      var ttl = h(r.k)+' — '+r.v+' เรื่อง (ปี '+KW_EARLY[0]+'–'+KW_EARLY[KW_EARLY.length-1]+' '+r.e+
                ' เรื่อง · ปี '+KW_LATE[0]+'–'+KW_LATE[KW_LATE.length-1]+' '+r.l+' เรื่อง)';
      return '<button class="kwrow" type="button" data-act="kwq" data-a="'+h(r.k)+'" title="'+ttl+'">'+
        '<span class="kw-n">'+h(r.k)+'</span>'+
        '<div class="tr"><div class="fl" style="width:'+pct+'%"></div></div>'+
        '<span class="kw-c">'+r.v+'</span>'+
        '<span class="kw-t '+r.dir+'">'+LB[r.dir]+'</span></button>';
    }).join('')+'</div>'+
    (up.length ? '<p style="font-size:12.5px;color:var(--ink-2);margin-top:10px">'+
      '<b>อ่านแนวโน้ม:</b> คำสำคัญที่สัดส่วนเพิ่มขึ้นในสองปีงบประมาณล่าสุดคือ '+h(up.join(' · '))+
      ' ใช้เป็นข้อมูลประกอบการกำหนดทิศทางและกรอบการให้ทุนวิจัยในปีถัดไปได้</p>' : '')+
    '<p style="font-size:12px;color:var(--ink-3);margin-top:8px">กดที่คำสำคัญเพื่อดูผลงานทั้งหมดที่ใช้คำนั้น</p></div>';
}

/* แผนภูมิวงแหวน สำหรับสัดส่วนส่วนย่อยต่อทั้งหมด ไม่เกิน 4 ส่วน
   ใช้สีชุดหมวดหมู่ที่ผ่านการตรวจค่าความต่างแล้ว และกำกับชื่อกับตัวเลขทุกส่วนเสมอ */
function donut(title, rows, note){
  var total = rows.reduce(function(a,r){ return a+r.v; }, 0) || 1;
  var R = 68, SW = 26, C = 2*Math.PI*R, GAP = 3, acc = 0;
  var segs = rows.map(function(r, i){
    var len = Math.max(0, r.v/total*C - GAP);
    var s = '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="var(--c'+((i%4)+1)+')" stroke-width="'+SW+'"'+
      ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'">'+
      '<title>'+h(r.k)+' — '+r.v+' รายการ ('+Math.round(r.v/total*100)+'%)</title></circle>';
    acc += r.v/total*C;
    return s;
  }).join('');
  /* ปัดเปอร์เซ็นต์แบบเศษเหลือมากสุด เพื่อให้ผลรวมเท่ากับ 100 พอดี */
  var raw = rows.map(function(r){ return r.v/total*100; });
  var pcts = raw.map(function(x){ return Math.floor(x); });
  var short = 100 - pcts.reduce(function(a,b){ return a+b; }, 0);
  raw.map(function(x,i){ return {i:i, f:x-Math.floor(x)}; })
     .sort(function(a,b){ return b.f-a.f; })
     .slice(0, Math.max(0,short))
     .forEach(function(o){ pcts[o.i]++; });
  var legend = rows.map(function(r, i){
    return '<div class="lg-row"><span class="dsw" style="background:var(--c'+((i%4)+1)+')"></span>'+
      '<span class="lg-n">'+h(r.k)+'</span>'+
      '<span class="lg-v num">'+r.v+'</span>'+
      '<span class="lg-p num">'+pcts[i]+'%</span></div>';
  }).join('');
  return '<div class="card"><h3>'+h(title)+'</h3>'+
    '<div class="donut-wrap"><svg viewBox="0 0 200 200" class="donut" role="img" aria-label="'+h(title)+'">'+
      '<g transform="rotate(-90 100 100)">'+segs+'</g>'+
      '<text x="100" y="95" class="dn-total">'+total+'</text>'+
      '<text x="100" y="116" class="dn-lab">รายการ</text></svg>'+
      '<div class="lg-list">'+legend+'</div></div>'+
    (note?'<p class="chart-note">'+h(note)+'</p>':'')+'</div>';
}

/* แผนภูมิเส้นพร้อมพื้นที่ใต้เส้น สำหรับแนวโน้มตามช่วงเวลา */
function trendChart(title, pts, note){
  if(!pts.length) return '';
  var W = 560, H = 190, PL = 42, PR = 14, PT = 16, PB = 30;
  var max = Math.max.apply(null, pts.map(function(p){ return p.v; })), top = Math.max(4, Math.ceil(max*1.15));
  var iw = W-PL-PR, ih = H-PT-PB;
  var X = function(i){ return PL + (pts.length===1 ? iw/2 : i*iw/(pts.length-1)); };
  var Y = function(v){ return PT + ih - (v/top)*ih; };
  var ticks = [0, Math.round(top/2), top];
  var grid = ticks.map(function(t){
    return '<line x1="'+PL+'" y1="'+Y(t).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(t).toFixed(1)+'" class="gl"/>'+
      '<text x="'+(PL-8)+'" y="'+(Y(t)+4).toFixed(1)+'" class="ax ax-r">'+t+'</text>'; }).join('');
  var line = pts.map(function(p,i){ return X(i).toFixed(1)+','+Y(p.v).toFixed(1); }).join(' ');
  var area = PL+','+Y(0).toFixed(1)+' '+line+' '+(X(pts.length-1)).toFixed(1)+','+Y(0).toFixed(1);
  var peak = pts.reduce(function(a,b){ return b.v>a.v?b:a; }, pts[0]);
  var dots = pts.map(function(p,i){
    var big = (p===peak || i===pts.length-1);
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(big?5:4)+'" class="dot'+(big?' dot-em':'')+'">'+
      '<title>'+h(p.k)+' — '+p.v+' รายการ</title></circle>'+
      (big?'<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.v)-12).toFixed(1)+'" class="dl">'+p.v+'</text>':'');
  }).join('');
  var xlab = pts.map(function(p,i){
    return '<text x="'+X(i).toFixed(1)+'" y="'+(H-9)+'" class="ax">'+h(p.k)+'</text>'; }).join('');
  return '<div class="card"><h3>'+h(title)+'</h3>'+
    '<div class="svg-wrap"><svg viewBox="0 0 '+W+' '+H+'" class="trend" role="img" aria-label="'+h(title)+'">'+
      grid + '<polygon points="'+area+'" class="ar"/><polyline points="'+line+'" class="ln"/>'+ dots + xlab +
    '</svg></div>'+ (note?'<p class="chart-note">'+h(note)+'</p>':'') +'</div>';
}

/* ============ toast / modal ============ */
var toastN = 0;
function toast(msg, kind, undoLabel, undoFn){
  var box = $('toasts'); var id = 'tst'+(++toastN);
  var d = document.createElement('div');
  d.className = 'toast' + (kind ? ' '+kind : ''); d.id = id;
  d.innerHTML = '<span>'+h(msg)+'</span>' + (undoLabel ? '<button type="button" data-undo="'+id+'">'+h(undoLabel)+'</button>' : '');
  box.appendChild(d);
  while(box.children.length > 3){ box.removeChild(box.firstChild); }
  if(undoFn){ d.querySelector('[data-undo]').addEventListener('click', function(){ undoFn(); d.remove(); }); }
  setTimeout(function(){ var n=$(id); if(n) n.remove(); }, undoFn ? 9000 : 4200);
}
function modal(title, body, okLabel, okFn, cancelLabel){
  var m = document.createElement('div'); m.id='modal';
  m.innerHTML = '<div class="box" role="dialog" aria-modal="true"><h3>'+h(title)+'</h3><p>'+body+'</p>'+
    '<div class="btnrow" style="justify-content:flex-end"><button class="btn" id="mdNo" type="button">'+h(cancelLabel||'ยกเลิก')+'</button>'+
    '<button class="btn pri" id="mdYes" type="button">'+h(okLabel)+'</button></div></div>';
  document.body.appendChild(m);
  var close = function(){ m.remove(); };
  $('mdNo').addEventListener('click', close);
  $('mdYes').addEventListener('click', function(){ close(); okFn(); });
  m.addEventListener('click', function(e){ if(e.target===m) close(); });
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc); } });
  setTimeout(function(){ var y=$('mdYes'); if(y) y.focus(); },30);
}

/* เวลาที่ข้อมูลถูกดึงมาแสดงล่าสุด ตั้งเมื่อเปิดหน้าเว็บ และปรับใหม่ทุกครั้งที่ข้อมูลในระบบเปลี่ยน */
var TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var DATA_AT = new Date();
var TH_MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
/* เดือนล่าสุดที่ปิดรอบแล้ว ใช้กำกับสถิติการเข้าชมรายเดือน */
function lastMonthLabel(){
  var d = new Date(DATA_AT.getFullYear(), DATA_AT.getMonth()-1, 1);
  return 'เดือน'+TH_MON_FULL[d.getMonth()]+' '+(d.getFullYear()+543);
}
function dataStamp(){
  var d = DATA_AT, p2 = function(n){ return (n<10?'0':'')+n; };
  return d.getDate()+' '+TH_MON[d.getMonth()]+' '+(d.getFullYear()+543)+
         ' เวลา '+p2(d.getHours())+'.'+p2(d.getMinutes())+' น.';
}

/* 5 อันดับผลงานที่ถูกเปิดดูมากที่สุดในรอบ 30 วัน
   ยอดเข้าชมเป็นข้อมูลจำลอง และจะเพิ่มขึ้นจริงเมื่อมีการกดดูรายละเอียดในต้นแบบ */
function topViewed(n){
  var rows = by('published').slice().sort(function(a,b){
    var d = viewsOf(b) - viewsOf(a); return d !== 0 ? d : a.id.localeCompare(b.id);
  }).slice(0, n||5);
  if(!rows.length) return '';
  return '<div class="card"><h3>ผลงานที่ถูกเปิดดูมากที่สุด 5 อันดับ ประจำ'+h(lastMonthLabel())+'</h3>'+
   '<p style="font-size:12.5px;color:var(--ink-2);margin-bottom:8px">'+
   'นับจากจำนวนครั้งที่ผู้ใช้เปิดดูรายละเอียดตลอด'+h(lastMonthLabel())+' '+
   'ใช้เป็นข้อมูลประกอบการพิจารณาว่าหัวข้อใดกำลังเป็นที่สนใจ และควรขยายผลหรือจัดเวทีแลกเปลี่ยนเรียนรู้</p>'+
   '<div class="toplist">'+ rows.map(function(r,i){
     return '<button class="toprow" type="button" data-act="open" data-a="'+r.id+'">'+
       '<span class="rk" aria-hidden="true">'+(i+1)+'</span>'+
       '<span><span class="tt">'+h(r.title)+'</span>'+
       '<span class="ms">'+h(r.inst)+' · ปีงบประมาณ '+h(r.year)+' · '+h(r.type)+'</span></span>'+
       '<span class="vn">'+viewsOf(r)+' ครั้ง</span></button>';
   }).join('')+'</div>'+
   '<p style="font-size:12px;color:var(--ink-3);margin-top:9px">ยอดเปิดดูในต้นแบบเป็นข้อมูลจำลอง '+
   'แต่จะเพิ่มขึ้นจริงทุกครั้งที่กดดูรายละเอียดผลงาน ลองกดดูแล้วกลับมาดูตัวเลขอีกครั้ง</p></div>';
}

/* ---- สถิติการเข้าชมรอบ 30 วัน (จำลอง) ---- */
var HOT_KW = ['วิสาหกิจชุมชน','เกษตรอัจฉริยะ','อินเทอร์เน็ตของสรรพสิ่ง','ความเป็นจริงเสมือน','ไฟฟ้ากำลัง'];
/* จัดลำดับความนิยมแบบคงที่ แล้วแจกยอดเข้าชมตามเส้นโค้งที่ลดหลั่น
   อันดับต้นห่างกันชัดเจน ส่วนอันดับท้ายไล่เรียงใกล้กันตามธรรมชาติของข้อมูลการเข้าชม */
var VIEW_CACHE = {n:-1, map:{}};
function viewMap(){
  var pub = by('published');
  if(VIEW_CACHE.n === pub.length) return VIEW_CACHE.map;
  var rank = function(r){
    return (hashId(r.id) % 100000) + ((r.kw||[]).some(function(k){ return HOT_KW.indexOf(k)>=0; }) ? 130000 : 0);
  };
  var ord = pub.slice().sort(function(a,b){ return rank(b)-rank(a) || a.id.localeCompare(b.id); });
  var m = {};
  ord.forEach(function(r,i){
    m[r.id] = Math.round(740*Math.pow(0.80,i) + 260*Math.pow(0.97,i) + 18 + (hashId(r.id)%7));
  });
  VIEW_CACHE = {n:pub.length, map:m};
  return m;
}
function viewsOf(r){ return (viewMap()[r.id] || 20) + ((S.vmore && S.vmore[r.id]) || 0); }

/* คืนข้อความสั้นรอบคำค้นที่พบในเนื้อหาเอกสาร พร้อมเน้นคำนั้น */
function ftSnippet(r, q){
  var t = fullText(r), i = t.indexOf(q);
  if(i < 0) return '';
  var a = Math.max(0, i-55), b = Math.min(t.length, i+q.length+75);
  return (a>0?'…':'')+h(t.slice(a,i))+'<mark>'+h(q)+'</mark>'+h(t.slice(i+q.length,b))+(b<t.length?'…':'');
}
/* ผลงานนี้ตรงกับคำค้นเฉพาะในเนื้อหาเอกสาร ไม่ได้ตรงที่เมทาดาทา */
function ftOnly(r, q){
  if(!S.ft || !q) return false;
  var hay = [r.title, r.inst, r.lead, r.major, r.cat, r.type].concat(r.kw||[]).join(' ');
  return hay.indexOf(q) < 0 && fullText(r).indexOf(q) >= 0;
}

function matches(r){
  if(r.status!=='published') return false;
  if(S.fType && r.type!==S.fType) return false;
  if(S.fYear && r.year!==S.fYear) return false;
  if(S.fInst && r.inst!==S.fInst) return false;
  if(S.fCat && r.cat!==S.fCat) return false;
  if(S.fRegion && regionOf(r)!==S.fRegion) return false;
  if(S.fSrc && srcOf(r)!==S.fSrc) return false;
  var q = (S.q||'').trim();
  if(!q) return true;
  var hay = [r.title, r.inst, r.lead, r.major, r.cat, r.type].concat(r.kw||[]).join(' ');
  if(hay.indexOf(q) >= 0) return true;
  return S.ft ? fullText(r).indexOf(q) >= 0 : false;
}
function activeFilters(){
  var out = [];
  if(S.q) out.push(['q','คำค้น: '+S.q]);
  if(S.fType) out.push(['ftype','ประเภท: '+S.fType]);
  if(S.fYear) out.push(['fyear','ปีงบประมาณ: '+S.fYear]);
  if(S.fInst) out.push(['finst','สถานศึกษา: '+S.fInst]);
  if(S.fCat) out.push(['fcat','ประเภทวิชา: '+S.fCat]);
  if(S.fRegion) out.push(['fregion','ภาค: '+S.fRegion]);
  if(S.fSrc) out.push(['fsrc','แหล่งทุน: '+S.fSrc]);
  return out;
}

SC['r.status'] = function(){
  var m = mine().filter(function(r){ return r.status!=='draft'; });
  if(S.cur){
    var r = rec(S.cur);
    if(r){
      var steps = [{t:'ส่งผลงานเข้าระบบ',s:1},{t:'เจ้าหน้าที่ตรวจสอบข้อมูลและเอกสาร',s:2},{t:'ผลการพิจารณา',s:3},
                   {t:'จัดหมวดหมู่และกำหนดวันเผยแพร่',s:4},{t:'เผยแพร่บนระบบ',s:5}];
      var at = r.status==='wait'?2 : r.status==='fix'?3 : r.status==='approved'?4 : r.status==='published'?5 : 1;
      var tl = steps.map(function(x){
        var cls = x.s<at ? 'done' : (x.s===at ? 'now' : '');
        var extra = '';
        if(x.s===3 && r.status==='fix' && r.feedback){
          extra = '<div class="m"><b>ข้อเสนอแนะจากเจ้าหน้าที่</b><ol style="margin:5px 0 0;padding-left:19px">'+
            r.feedback.map(function(f){ return '<li>'+h(f)+'</li>'; }).join('')+'</ol></div>';
        }
        var when = '';
        (r.hist||[]).forEach(function(hh){ if(hh.t.indexOf(x.t.slice(0,8))===0) when = hh.d; });
        return '<div class="it '+cls+'"><div class="t">'+h(x.t)+'</div><div class="d">'+(cls==='done'?'ดำเนินการแล้ว'+(when?' · '+h(when):''):(cls==='now'?'ขั้นตอนปัจจุบัน':'รอดำเนินการ'))+'</div>'+extra+'</div>';
      }).join('');
      return crumbs([{t:'ภาพรวมและการติดตามสถานะผลงาน',go:'r.home'},{t:'เส้นทางการพิจารณา'}])+
        '<div class="pagehead"><div><h2>'+h(r.title)+'</h2><p class="ph-sub"><span class="num">'+h(r.id)+'</span></p></div>'+pill(r.status)+'</div>'+
        '<div class="card"><div class="tl">'+tl+'</div></div>'+
        '<div class="btnrow">'+backBtn('r.home','กลับหน้าภาพรวม')+
        (r.status==='fix' ? '<button class="btn pri" type="button" data-act="edit" data-a="'+r.id+'">แก้ไขและส่งกลับ</button>' : '')+'</div>';
    }
  }
  return SC['r.home']();
};

      pb = by('published').length, dr = by('draft').length;

  var pubs = by('published');

  var used = pubs.filter(function(r){ return r.util && r.util.orgs && r.util.orgs.length; }).length;
  var FN = [['draft','ร่าง',dr],['wait','รอตรวจสอบ',w],['fix','ต้องแก้ไข',fx],['approved','อนุมัติ',ap],['published','เผยแพร่',pb]];
  var fmax = Math.max(1, Math.max.apply(null, FN.map(function(x){return x[2];})));
  var FCOL = {draft:'var(--mute)', wait:'var(--warn)', fix:'var(--bad)', approved:'var(--info)', published:'var(--ok)'};

  return '<div class="pagehead"><div><h2>กระดานภาพรวมการดำเนินงาน</h2>'+
   '<p class="ph-sub">'+h(WHO.adm)+' · ตัวเลขทุกช่องคำนวณสดจากข้อมูลในระบบ ใช้ตอบผู้บริหารได้ทันทีโดยไม่ต้องรวบรวมเอง</p></div></div>'+

   '<div class="tiles">'+tile('รอตรวจสอบ',w,'w')+tile('ส่งกลับให้แก้ไข',fx,'b')+
     tile('รอเผยแพร่',ap,'i')+tile('เผยแพร่แล้ว',pb,'g')+tile('คำขอเอกสารรอพิจารณา',reqWait,'w')+'</div>'+

   (w? '<div class="alert w"><b>มีงานรอตรวจสอบ '+w+' รายการ</b> <button class="lnk" type="button" data-act="go" data-a="a.queue">เปิดรายการรอตรวจสอบ</button></div>':'')+
   (ap? '<div class="alert i"><b>อนุมัติแล้วรอจัดหมวดหมู่และเผยแพร่ '+ap+' รายการ</b> · ยังค้นไม่พบในระบบจนกว่าจะกดเผยแพร่ '+
        '<button class="lnk" type="button" data-act="go" data-a="a.publishq">เปิดรายการ</button></div>':'')+
   (!w && !ap ? '<div class="alert g">ไม่มีงานคงค้าง ทุกรายการได้รับการพิจารณาและเผยแพร่แล้ว</div>':'')+

     '<div class="funnel">'+ FN.map(function(x){
       var pct = Math.max(2, Math.round(x[2]/fmax*100));

         '<div class="tr" title="'+h(x[1])+' — '+x[2]+' รายการ"><div class="fl" style="width:'+pct+'%;background:'+FCOL[x[0]]+'"></div></div>'+

   '</div>'+

         '<div class="lg-list">'+ seg.map(function(s){

   '</div>';
};

SC['a.queue'] = function(){
  var list = S.recs.filter(function(r){ return r.status==='wait' || r.status==='fix'; });
  return '<div class="pagehead"><div><h2>รายการรอตรวจสอบ</h2><p class="ph-sub">'+list.length+' รายการรอดำเนินการ</p></div></div>'+
   (list.length? '<div class="tw"><table><thead><tr><th>รหัสผลงาน</th><th>ชื่อผลงาน / สถานศึกษา</th><th>ประเภท</th><th>สถานะ</th><th></th></tr></thead><tbody>'+
    list.map(function(r){ return '<tr><td class="num">'+h(r.id)+'</td>'+
      '<td><b>'+h(r.title)+'</b><br>'+h(r.inst)+'</td><td>'+h(r.type)+'</td><td>'+pill(r.status)+'</td>'+
      '<td>'+(r.status==='wait' ? '<button class="btn sm pri" type="button" data-act="review" data-a="'+r.id+'">เปิดตรวจ</button>'

SC['a.review'] = function(){
  var r = rec(S.cur); if(!r) return '<div class="alert b">ไม่พบผลงาน</div>'+backBtn('a.queue');
  var CK = [['t1','ชื่อผลงานสอดคล้องกับเนื้อหาในรายงาน'],['t2','บทคัดย่อครบถ้วนและมีความยาวเพียงพอ'],
            ['t3','เมทาดาทาบังคับครบถ้วน'],['t4','รายงานฉบับสมบูรณ์สกัดข้อความได้'],
            ['t5','คำสำคัญตรงกับบัญชีคำศัพท์ควบคุม'],['t6','ไม่ปรากฏข้อมูลส่วนบุคคลของบุคคลที่สาม'],
            ['t7','ระบุการยินยอมเผยแพร่แล้ว']];
  var done = CK.filter(function(c){ return S.checks[c[0]]; }).length;
  return crumbs([{t:'รายการรอตรวจสอบ',go:'a.queue'},{t:'ตรวจสอบผลงาน'}])+
   '<div class="pagehead"><div><h2>'+h(r.title)+'</h2>'+
   '<p class="ph-sub">'+h(r.inst)+' · ปีงบประมาณ '+h(r.year)+' · <span class="num">'+h(r.id)+'</span></p></div>'+pill(r.status)+'</div>'+
   errSummary()+
   '<div class="grid2">'+
    '<div class="card"><h3>รายการตรวจความครบถ้วน <span style="font-weight:400;font-size:13px;color:var(--ink-3)">('+done+' จาก 7)</span></h3>'+
      CK.map(function(c){ return '<label class="ck"><input type="checkbox" data-ck="'+c[0]+'"'+(S.checks[c[0]]?' checked':'')+'> '+h(c[1])+'</label>'; }).join('')+
    '</div>'+
    '<div class="card"><h3>ผลการตรวจความซ้ำซ้อน</h3>'+
      (r.sim ? '<div class="alert w"><b>พบความคล้ายคลึง '+r.sim+' เปอร์เซ็นต์</b><br>กับ '+h(r.simWith)+'<br>ควรตรวจสอบว่าเป็นการต่อยอดหรือการส่งซ้ำ</div>'
             : '<div class="alert g"><b>ไม่พบความซ้ำซ้อน</b> ค่าความคล้ายคลึงสูงสุดอยู่ที่ 18 เปอร์เซ็นต์</div>')+
      '<dl class="kv" style="grid-template-columns:130px 1fr">'+kv('บทคัดย่อ',(r.abstract||'').length+' ตัวอักษร')+
      kv('คำสำคัญ',(r.kw||[]).join(', ')||'—')+kv('เอกสารบังคับ',(r.files.full&&r.files.abs&&r.files.img)?'ครบ':'<span style="color:var(--bad)">ไม่ครบ</span>')+'</dl>'+
    '</div></div>'+
   '<div class="card"><h3>ข้อเสนอแนะถึงนักวิจัย</h3>'+
     '<div class="field'+(S.errs.fb?' bad':'')+'"><label for="f_fb">ระบุสิ่งที่ต้องแก้ไข ทีละข้อ ขึ้นบรรทัดใหม่</label>'+
     '<textarea id="f_fb" data-f="fb" placeholder="เช่น ขอให้เพิ่มความยาวบทคัดย่อไม่น้อยกว่า 250 ตัวอักษร">'+h(S.feedbackDraft)+'</textarea>'+
     (S.errs.fb?'<div class="err" role="alert">'+h(S.errs.fb)+'</div>':'<div class="hint">จำเป็นเมื่อกดส่งกลับให้แก้ไข ไม่จำเป็นเมื่อกดอนุมัติ</div>')+'</div>'+
     '<div class="btnrow"><button class="btn ok" type="button" data-act="approve" data-a="'+r.id+'">อนุมัติ</button>'+
     '<button class="btn bad" type="button" data-act="sendback" data-a="'+r.id+'">ส่งกลับให้แก้ไข</button>'+
     backBtn('a.queue','กลับคิว')+'</div>'+

function validateStep(){
  S.errs = {}; var f = S.form;
  if(S.step===1){
    if(!f.title.trim()) S.errs.title = 'ยังไม่ได้กรอกชื่อผลงาน';
    if(!f.type) S.errs.type = 'ยังไม่ได้เลือกประเภทผลงาน';
    if(!f.fund) S.errs.fund = 'ยังไม่ได้เลือกประเภททุน';
    if(!f.year) S.errs.year = 'ยังไม่ได้เลือกปีงบประมาณที่ได้รับทุน';
    if(!f.yearDone) S.errs.yearDone = 'ยังไม่ได้เลือกปีที่ดำเนินการแล้วเสร็จ';
    else if(f.year && f.yearDone && f.yearDone < f.year) S.errs.yearDone = 'ปีที่แล้วเสร็จต้องไม่น้อยกว่าปีที่ได้รับทุน';
    if(!f.cat) S.errs.cat = 'ยังไม่ได้เลือกประเภทวิชา';
    if(!f.major) S.errs.major = 'ยังไม่ได้เลือกสาขาวิชา';
    if(!f.target.trim()) S.errs.target = 'ยังไม่ได้ระบุกลุ่มเป้าหมาย';
    var L = (f.abstract||'').trim().length;
    if(L===0) S.errs.abstract = 'ยังไม่ได้กรอกบทคัดย่อ';
    else if(L<250) S.errs.abstract = 'บทคัดย่อสั้นเกินไป ขณะนี้ '+L+' ตัวอักษร ต้องไม่น้อยกว่า 250 ตัวอักษร เพื่อให้ค้นหาเจอด้วยคำสำคัญ';
    if(f.kw.length<3) S.errs.kw = 'เลือกคำสำคัญอย่างน้อย 3 คำ ขณะนี้เลือกแล้ว '+f.kw.length+' คำ';
  } else if(S.step===2){
    var miss = [];
    if(!f.files.full) miss.push('รายงานวิจัยฉบับสมบูรณ์');
    if(!f.files.abs) miss.push('บทคัดย่อ (ไทย–อังกฤษ)');
    if(!f.files.img) miss.push('ภาพผลงาน');
    if(miss.length) S.errs.files = 'ยังไม่ได้แนบเอกสารบังคับ ได้แก่ '+miss.join(', ');
  } else if(S.step===4){
    if(!f.confirm) S.errs.confirm = 'ต้องติ๊กยืนยันว่าตรวจทานข้อมูลครบถ้วนแล้วก่อนจึงจะส่งได้';
  }
  return Object.keys(S.errs).length===0;
}
function formToRec(){
  var f = S.form;
  var r = f.id ? rec(f.id) : null;
  if(!r){ r = {id:'VEC-'+f.year+'-NEW-'+String(Math.floor(Math.random()*900)+100), owner:ME, hist:[]}; S.recs.unshift(r); }
  ['title','titleEn','type','fund','year','yearDone','cat','major','inst','lead','co','level','target','area','abstract'].forEach(function(k){ r[k]=f[k]; });
  r.kw = f.kw.slice(); r.files = {full:f.files.full,abs:f.files.abs,img:f.files.img};
  r.consent = {pub:f.consent.pub,req:f.consent.req,contact:f.consent.contact,hold:f.consent.hold};
  if(!r.hist) r.hist=[];
  return r;
}

document.addEventListener('change', function(e){

      if(mb > 10){ S.v02file=null; S.errs.rg_doc='ไฟล์ใหญ่เกิน 10 MB กรุณาลดขนาดไฟล์ก่อน'; }

      render(); }
    return;
  }
  var k = t.getAttribute && t.getAttribute('data-f');
  if(k==='kwsel' && t.value){ if(S.form.kw.indexOf(t.value)<0) S.form.kw.push(t.value); delete S.errs.kw; render(); return; }
  if(k==='cat'){ S.form.cat = t.value; S.form.major=''; render(); return; }
  if(k==='ftsw'){ S.ft = t.checked; render(); return; }

  if(fk){ S.form.files[fk] = t.checked; delete S.errs.files; render(); return; }
  var ck = t.getAttribute && t.getAttribute('data-consent');

  var cc = t.getAttribute && t.getAttribute('data-ck');

});

      var ur2 = S.ureq.filter(function(x){ return x.id===a; })[0];
      modal('ปฏิเสธคำขอนี้','จะแจ้งกลับ <b>'+h(ur2.who)+'</b> ว่าคำขอ'+h(ur2.kind)+'ไม่ได้รับการอนุมัติ','ปฏิเสธ', function(){
        ur2.status='no'; logit(WHO[S.role],'ปฏิเสธคำขอแก้ไขข้อมูลผู้ใช้', ur2.who); save(); render();
        toast('ปฏิเสธคำขอแล้ว', null, 'เลิกทำ', function(){ ur2.status='wait'; save(); render(); }); });
      break;
    case 'pwreset':
      logit(WHO[S.role],'ส่งลิงก์ตั้งรหัสผ่านใหม่ให้ผู้ใช้','—'); save();
      toast('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปยังอีเมลของผู้ใช้แล้ว','g'); break;
    case 'export': toast('ส่งออกข้อมูลรูปแบบ '+a+' แล้ว (ต้นแบบจำลอง ไม่มีไฟล์จริง)','g'); break;
    case 'backup': toast('สำรองข้อมูลเรียบร้อย สร้างจุดกู้คืนใหม่แล้ว','g'); break;
    case 'restore':
      modal('กู้คืนจากจุดสำรอง','ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ด้วยข้อมูล ณ จุดสำรองล่าสุด การกระทำนี้ย้อนกลับไม่ได้','กู้คืน', function(){
        resetAll(); }); break;
    case 'rmkw':
      var i2 = S.form.kw.indexOf(a); if(i2>=0) S.form.kw.splice(i2,1); render(); break;
  }
});

$('resetBtn').addEventListener('click', function(){
  modal('เริ่มต้นใหม่','ข้อมูลที่ทดลองกรอกและสถานะผลงานทั้งหมดจะกลับไปเป็นชุดตั้งต้น เหมาะสำหรับให้ผู้ประเมินคนถัดไปเริ่มจากจุดเดียวกัน','เริ่มต้นใหม่', resetAll);
});

load(); render();
</script>
